apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regatta-api-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "regatta-ip"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regatta-api
                port:
                  number: 8080
